name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: lint · typecheck · test · build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Eval agent specs
        run: npm run eval:agents

      - name: Build
        run: npm run build

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: Audit (fail on high+)
        run: npm audit --audit-level=high

  dist-integrity:
    name: dist/ matches src/
    # Linux-only, like brain-template-drift below: `git status --porcelain`
    # over a freshly built dist/ can misreport identical content as changed
    # on Windows runners because of core.autocrlf line-ending rewriting, so we
    # keep this check on the one platform where that class of false positive
    # can't happen. Cross-platform build correctness is already covered by
    # the matrixed build-test job above; this job only checks that whoever
    # last committed dist/ actually ran the build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: Verify dist/ is not stale
        run: npm run verify:dist

  brain-template-drift:
    name: brain template parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Clone harness-brain (best effort)
        id: clone
        continue-on-error: true
        env:
          # Compare against the matching branch (a companion PR's changes
          # live on a same-purpose branch pre-merge, though — since each
          # repo's branch name is generated independently — not always a
          # same-named one); fall back to the default branch otherwise, and
          # record which happened so the verify step below knows how much
          # to trust a drift finding.
          BRAIN_BRANCH: ${{ github.head_ref || github.ref_name }}
          BRAIN_URL: https://github.com/exponen-agi/harness-brain.git
        run: |
          set -e
          if git clone --depth 1 --branch "$BRAIN_BRANCH" "$BRAIN_URL" "$RUNNER_TEMP/harness-brain"; then
            echo "exact_branch=true" >> "$GITHUB_OUTPUT"
          else
            git clone --depth 1 "$BRAIN_URL" "$RUNNER_TEMP/harness-brain"
            echo "exact_branch=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify templates/brain matches harness-brain
        env:
          BRAIN_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if [ ! -d "$RUNNER_TEMP/harness-brain" ]; then
            echo "::notice::harness-brain not reachable from CI — skipping drift check. Run \`npm run verify:brain-template\` locally against a sibling checkout."
            exit 0
          fi
          if node scripts/check-brain-template.mjs "$RUNNER_TEMP/harness-brain"; then
            exit 0
          fi
          if [ "${{ steps.clone.outputs.exact_branch }}" = "true" ]; then
            echo "::error::templates/brain/ has drifted from the same-named companion branch on harness-brain — see the comparison above."
            exit 1
          fi
          echo "::warning::templates/brain/ differs from harness-brain's default branch, but no branch named '$BRAIN_BRANCH' exists there to compare against instead — expected while a companion PR with a different branch name is still open on harness-brain. Not failing the build; this gets a real comparison once branch names line up or the companion PR merges. Verify by hand with \`npm run verify:brain-template\` against the actual companion checkout."
