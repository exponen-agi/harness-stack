# Resolve abstract model_tier -> concrete model, per platform.
#
# This is the ONLY place concrete model names live. Update this file as
# platforms ship new models; nothing else in .subagents/ changes.
# Run `harness update` (when available) to refresh it from the shipped default.
#
# Lineups below are current as of August 2026 and WILL drift — edit freely.
#
# Claude model IDs always carry the "claude-" prefix (e.g. "claude-opus-5",
# not "opus-5") — a bare tier name is not a real model ID and will fail at
# inference time. tests/model-map-template.test.ts enforces this for the
# claude-code block so this class of bug can't ship silently again.

claude-code:
  fast:      claude-haiku-4-5-20251001
  reasoning: claude-sonnet-5
  deep:      claude-opus-5
  inherit:   inherit

antigravity:
  fast:      gemini-3.5-flash
  reasoning: gemini-3-pro
  deep:      gemini-3-pro          # or claude-opus-4-6 if Claude routing enabled
  inherit:   inherit

codex:
  fast:      gpt-5.4-mini
  reasoning: gpt-5.5
  deep:      gpt-5.5               # with high reasoning effort
  inherit:   inherit

# Cursor and Copilot let the host pick the model, so every tier resolves to
# "inherit" (the adapter omits an explicit model and uses whatever the host
# exposes). Override per-tier here if your setup pins specific models.
cursor:
  fast:      inherit
  reasoning: inherit
  deep:      inherit
  inherit:   inherit

copilot:
  fast:      inherit
  reasoning: inherit
  deep:      inherit
  inherit:   inherit
